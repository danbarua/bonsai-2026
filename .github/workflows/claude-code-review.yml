name: Claude Vacuous-Test Review

# INVOKED, never automatic. Two reasons, both about cost rather than taste.
#
# This project pushes directly to shared branches -- roughly twenty times to
# `stage2b` in a single session -- so a push trigger would re-review the same
# code repeatedly and emit near-identical reports on work in progress. Noise
# gets ignored, and an ignored guard trains route-around, which is the exact
# failure this repository spends its discipline avoiding. Paid for with
# tokens, at that.
#
# The `pull_request` trigger is kept because it costs nothing while no PRs
# exist, and because the day one is opened is a moment where review is wanted
# by definition.
#
# The value here is the PROMPT, not the schedule: it encodes what this
# project's reviews are actually for, so invoking it is one command rather
# than remembering to type all of the below. General-purpose review is
# already available by mentioning @claude, via claude.yml.

on:
  workflow_dispatch:
    inputs:
      target:
        # NO DEFAULT, deliberately. `HEAD~1..HEAD` was one, and it is EMPTY
        # after a merge -- the merge commit's tree equals its parent's -- so
        # the pre-filled value reviewed nothing and the run went green.
        # Observed on run 31256572529. Any default risks that: a value the
        # caller did not choose, reviewing a range that happens to be empty,
        # reported as success. Required and unfilled forces one deliberate
        # decision instead.
        description: >-
          Commit range or ref to review. Must be non-empty: e.g.
          origin/main...HEAD for this branch's changes, or an explicit
          a..b range. NOTE HEAD~1..HEAD is empty after a merge.
        required: true
  pull_request:
    types: [opened, ready_for_review, reopened]

jobs:
  vacuous-test-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # a commit-range target needs history

      - name: Review for vacuous tests
        id: review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Puts the Claude Code Report in the step summary. The action's own
          # mechanism, used in preference to anything hand-rolled: the first
          # version of this workflow asked the PROMPT to write a review file,
          # which is prompt-dependent and produces nothing at all if the model
          # simply does not comply. `display_report` and `execution_file`
          # below are produced by the action regardless of what the model
          # does, which is the difference between a mechanism and a request.
          display_report: true
          # A machine-checkable record of what the review DID, separate from
          # what it concluded. `files_examined` is the field that matters:
          # it makes "this review examined nothing" a schema-validated fact
          # rather than something inferred from the absence of prose.
          #
          # Note carefully what is gated on it. The build fails when the
          # review produced no result -- an absence -- and never on what the
          # review found. Findings stay advisory, because an LLM verdict that
          # can turn a build red is the failure mode this repository has
          # spent the most effort avoiding. Deterministic checks gate; this
          # reports.
          # Without this the review is blindfolded. Measured on run
          # 31255640813: TWELVE permission denials, every one a Bash call it
          # needed to read its own diff -- `gh pr view`, `gh pr diff`,
          # `git fetch refs/pull/N/head`, `git log --parents` -- retried
          # across 25 turns and $0.96 before it found another route. On a
          # runner there is nobody to approve, so "requires approval" means
          # denied, silently.
          #
          # The consequence is worse than waste. Had that PR contained test
          # files, the review could have reported `files_examined: []` and
          # the publisher would have failed it for examining nothing -- a red
          # build blamed on the review when the cause was this config.
          #
          # Read-only and enumerated rather than blanket Bash. A reviewer
          # needs to SEE the diff; it has no business writing, pushing, or
          # running the suite.
          #
          # The prompt forbids all three -- but only since the run that
          # measured this comment wrong. It previously claimed the prompt
          # covered running the suite when the prompt named only the other
          # two, and the model spent five of that run's denials attempting
          # exactly the uncovered one. A comment asserting a prohibition it
          # had not checked, in the file whose subject is claims nobody
          # checked.
          claude_args: |
            --allowed-tools 'Read,Grep,Glob,Bash(git diff:*),Bash(git diff-tree:*),Bash(git log:*),Bash(git show:*),Bash(git fetch:*),Bash(git rev-parse:*),Bash(git merge-base:*),Bash(git ls-tree:*),Bash(gh pr view:*),Bash(gh pr diff:*)'
            --json-schema '{"type":"object","properties":{"no_tests_changed":{"type":"boolean","description":"True if the diff contained no test files at all"},"files_examined":{"type":"array","items":{"type":"string"},"description":"Every test file actually read, by path"},"findings":{"type":"array","items":{"type":"object","properties":{"file":{"type":"string","description":"Path of the file CONTAINING the test -- not the file the test examines. These differ whenever a test inspects another file, which most of this suite does."},"test":{"type":"string","description":"Name of the test function, as written in that file"},"category":{"type":"string","description":"VACUOUS_TESTS.md taxonomy letter, or none"},"what_would_have_to_change":{"type":"string","description":"What would have to change for this test to fail; say nothing if the answer is nothing"}},"required":["file","test","category","what_would_have_to_change"]}},"summary":{"type":"string"}},"required":["no_tests_changed","files_examined","findings","summary"]}'
          prompt: |
            Review the changed tests in ${{ github.event.inputs.target || format('the pull request {0}', github.event.pull_request.number) }}.

            Read docs/VACUOUS_TESTS.md FIRST. It is this project's catalogue
            of tests that passed for reasons unrelated to what they named,
            and its taxonomy is the specification for this review. Take the
            categories and the count from the document itself -- it grows,
            and this prompt deliberately states neither. A generic code
            review is not what is wanted here and is already available by
            mentioning @claude.

            For every test added or modified, answer one question in writing:

              WHAT WOULD HAVE TO CHANGE FOR THIS TEST TO FAIL?

            If the answer is "nothing", say so plainly and name the taxonomy
            category. The catalogue records that a large share of its
            incidents were caught by exactly this question and no other
            method; it gives the tally, this prompt does not.

            Check specifically for the shapes that have actually occurred here:

            - a test that greps or substring-matches SOURCE rather than
              evaluating a decision (category A). The precedent: a test for a
              missing halt asserted `halt_reasons.append(...)` appeared in the
              source, which survives the guarding branch being disabled by
              `if False:`. It was green against broken code.
            - a narrowing verified with the broader form (category F): an
              explicit list checked by running the glob it narrows.
            - a normaliser between the test and the mechanism (category F,
              layered): a wrapper ending in an unconditional exit, a catch-all,
              a default return. No input can make such a test fail.
            - the component tested while its wiring is not (category G):
              registration, invocation, input supply, or scheduling. A correct
              component that nothing reaches is not enforced.
            - an assertion that passes on an EMPTY extraction. If a set, list
              or match could be empty, is there a guard that says so?

            Also flag any test that would pass if its fixture were replaced by
            a trivially different one, and any assertion whose failure message
            would not tell a reader what broke.

            COMMENT ONLY. Do not modify files, do not push, do not approve or
            request changes. This review advises; the deterministic checks in
            cloudbuild.yaml are what gate. Keeping those apart is deliberate --
            an LLM verdict wearing a green badge is the failure mode this
            repository has spent the most effort learning to avoid.

            DO NOT RUN THE TEST SUITE, and do not treat a green suite as
            evidence about any test you are reviewing. This is the review's
            central premise rather than a resource limit: every test in the
            catalogue PASSED. A vacuous test is one that passes for a reason
            unrelated to what it names, so running it can only tell you what
            is already known and can actively mislead. Read it and reason
            about what would make it fail. The runner denies these commands
            in any case, and earlier runs spent turns rediscovering that.

            OPEN YOUR REPORT by naming every test file you actually read. A
            report that does not say what it examined cannot be told apart
            from one that examined nothing, and that is the failure this
            review exists to catch -- so it must not be the failure the
            review itself commits.

            If the changed files contain no tests, say so in one line and
            stop -- and if the range itself is EMPTY, say that instead and
            distinguish the two. "No tests changed" and "no files changed at
            all" are different facts, and the second usually means the range
            was wrong rather than the code clean.

            Prefer one Bash call per command. A compound line joined with `;`
            cannot be verified against the tool allowlist and will be denied
            as a whole, even when every part of it would be permitted alone.

      # The review is worthless if its findings are invisible. On a manual
      # run there is no PR to comment on, and the action hides the SDK's
      # output by default, so without this a green run and a real review look
      # identical from outside -- exactly the confusion documented in
      # docs/proposals/CI_CLOUDBUILD.md after the first firing.
      # `display_report` above handles the readable case. This step handles
      # the case that has actually happened twice: the job reports success
      # and publishes nothing. It announces that absence rather than letting
      # a green badge stand in for a review.
      - name: Announce it if nothing was published
        if: always()
        # `structured_output` is the schema-validated JSON. `execution_file`
        # is a PATH to the raw execution log -- wiring that one in here cost
        # a red build on first run, because the script correctly refused a
        # filename as JSON. Passed through `env` rather than interpolated
        # into the command, so a quote or brace in the JSON cannot break the
        # shell line.
        env:
          STRUCTURED_OUTPUT: ${{ steps.review.outputs.structured_output }}
        run: bash tools/ci/publish_review.sh "$STRUCTURED_OUTPUT"

      - name: Keep the execution record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-review-execution
          path: ${{ steps.review.outputs.execution_file }}
          if-no-files-found: warn
