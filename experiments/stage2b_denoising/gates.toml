# Stage 2B binding-clause inventory.
#
# Reviewer requirement 4 (ruling of 2026-08-08, §5; scope settled by the
# follow-up ruling §II-III). Reconciled by tools/gates/gate_inventory.py.
#
#     make stage2b-gate-inventory
#
# WHAT THE TERMS MEAN -- "binding clause", the three kinds, and what each
# binds and on whom -- is in `docs/GLOSSARY.md`, not here. That vocabulary
# is used in tasks, in mail, and by a reconciler this file does not own, so
# it belongs where terms are defined rather than in one of its consumers.
#
# WHAT EACH KIND REQUIRES is at that kind's own section divider below, not
# in this header. A reader filling a `binding_claim` row is already at the
# binding_claim section; a contract at the top of the file is read once at
# orientation and needed later, which is exactly when it is furthest away.
#
# ANTI-GAMING, quoted from the ruling and enforced by a reviewer rather than
# by any check in this file: "a clause cannot be moved from binding_gate to
# another kind merely because enforcement is absent." Several rows below are
# deliberately failing for exactly that reason. It is stated here rather
# than per-kind because it is the one rule that governs all of them.

# The review attestation lives at the END of this file, in
# `[semantic_review]`, and is a signature over everything above it rather
# than a boolean. See that block for why.

# =============================================================================
# binding_gate -- runtime decision obligations
# =============================================================================
#
# Binds THE RUNNING PROGRAM. Something is evaluated, and something halts or
# branches on the result. The only kind whose enforcement a machine can
# check -- which is why it carries the most fields, and why an empty one
# fails readiness rather than being reclassified.
#
# Every field required. Six dimensions plus scheduling:
#
#   enforcement              the executable predicate, `path/to/file.py::name`
#   production_reachability  the production path(s) that reach it, INCLUDING
#                            wrappers and orchestration. A correct predicate
#                            production never invokes is not a gate.
#   input_wiring             the concrete runtime values supplied, and their
#                            provenance
#   decision_consequence     the observable halt or branch on rejection.
#                            Logging a failed predicate without preventing
#                            continuation does not qualify unless the design
#                            defines the gate as advisory.
#   test                     the test, `path::name`
#   break_demonstrated       evidence the test flips RED under a deliberate
#                            local disable. A source grep, a symbol
#                            reference, or a test that merely names the
#                            predicate does not qualify -- see VACUOUS_TESTS
#                            #17 and #20, both of which were exactly that.
#   trigger                  what SCHEDULES the test (`ci-fast`, `manual`).
#                            A separate axis from reachability: "somebody
#                            runs it by hand" is reported, not failed;
#                            "production never calls it" is a failure.

