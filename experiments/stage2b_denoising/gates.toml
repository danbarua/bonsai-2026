# =============================================================================
# semantic_review -- who reviewed what, and over which bytes
# =============================================================================
#
# REPLACES `reviewed = true`, on the Reviewer's ruling of 2026-08-09:
#
#   "I would not use a naked global `reviewed = true` boolean at all unless
#   its meaning is extremely explicit. Prefer a versioned review attestation
#   tied to the inventory commit/hash, recording the reviewed scope and
#   outcome."
#
# The boolean's defect was not that it was unset. It was that it said
# nothing about WHAT had been reviewed or WHEN, so once set it would have
# kept meaning "reviewed" across every subsequent edit. `inventory_sha256`
# is taken over everything ABOVE this block, so the attestation expires the
# next time a row it covered changes -- which is the only property that
# makes one worth having.
#
# It also replaces a requirement nobody upstream ever set. The boolean's
# comment read "set true only when a human has read every row", and tracing
# it found no such demand in any ruling: an agent invented a human
# obligation, encoded it as a build-failing gate, and it was presented to
# Dan as something owed. The Reviewer's answer was explicit -- there is no
# requirement for anyone to read all 89 rows -- and that human review is FOR
# the semantically non-machine-decidable dispositions, not for gate and
# value rows that already carry causal break evidence.

