[binding_gate.a2f535ba3406]
# The write-once invariant: force=True on a LINEAGE artifact refuses.
enforcement = "experiments/stage2b_denoising/stage2b_gcs.py::ensure_artifact"
production_reachability = """
Every artifact-producing step of every ladder driver goes through
ensure_artifact; the refusal is raised BEFORE `produce` runs, so it cannot
be reached only after computation. run_ladder_stage3.py's ensure_npz /
ensure_json / ensure_text wrappers are the only artifact writers in the
stage-3 driver, and each delegates to it."""
input_wiring = """
`name` from gcs.object_path (stage/condition/kind/ext/split), classified by
artifact_class against RUN_SCOPED_KIND_PREFIXES; `force` from the call
site, False everywhere in run_ladder_stage3.py (asserted by
test_the_driver_never_forces_an_overwrite)."""
decision_consequence = "WriteOnceViolation raised before produce() executes."
test = "tests/test_stage2b_gcs.py::test_an_orphan_payload_closes_every_ordinary_route"
break_demonstrated = """
`if force and artifact_class(name) == LINEAGE:` -> `if False:` (break
`preproduce`): test_an_orphan_payload_closes_every_ordinary_route FAILS,
and its `produced == []` assertion is what catches it -- the broken version
recomputes the step before refusing, burning the GPU time the pre-produce
check exists to protect."""
trigger = "ci-fast"

[binding_gate.f3bbc791e7c6]
# "no Stage 2B test-side result is accessed during stages 1-3"
enforcement = "experiments/stage2b_denoising/stage2b_gcs.py::_check_object_path_allowed"
production_reachability = """
Called by object_path on construction AND re-checked inside every transport
function (upload_file, download_file, ensure_artifact, consume_validated,
read_manifest, publish_manifest, delete_prefix, discard_uncommitted), so a
caller that assembles a name string by hand rather than via object_path is
still refused. That double-check is the reachability claim: there is no
path to bytes that bypasses it."""
input_wiring = """
`name` (any object path reaching the transport) and `allow_test_split`,
which defaults False at every call site in run_ladder_stage3.py -- asserted
by test_the_driver_never_names_the_test_split, which also greps the driver
for the literal 'testsplit' and 'allow_test_split'."""
decision_consequence = "PermissionError raised; no bytes transferred."
test = "tests/test_stage2b_gcs.py::test_discard_uncommitted_refuses_the_test_split"
break_demonstrated = """
Observed while writing that test: constructing the name via object_path
raises inside object_path BEFORE the function under test is called, so the
first version passed without exercising the guard at all. Rewritten to
build the name with allow_test_split=True and pass it without, which routes
the refusal through _check_object_path_allowed in the function under test;
the message changes from 'refusing to touch a Stage 2B TEST-side object' to
'it lies under the Stage 2B test-split root', confirming which guard
fired."""
trigger = "ci-fast"

