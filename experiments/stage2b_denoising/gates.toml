# =============================================================================
# not_binding -- candidates that are prose about something else
# =============================================================================
#
# THE FRICTIONLESS ESCAPE, named here so a reviewer can audit for it. A
# `not_binding` row needs one field and produces zero findings, while every
# binding kind demands six or seven and can fail. With 83 rows left and a red
# readiness signal, this section is the path of least resistance, and no check
# in `gate_inventory.py` can distinguish an honest disposition from a
# convenient one -- the anti-gaming clause it quotes covers moving a clause
# BETWEEN binding kinds, not dropping it out of them.
#
# So the reasons here are written to a fixed shape rather than freely: each
# opens with the category of prose the sentence actually is --
#
#     NARRATION      a past incident, error, or how a decision was reached
#     RATIONALE      why a choice was made; the argument behind a freeze
#     RESULT         what a run or check measured
#     PLAN           forward-looking sequencing or a recommendation
#
# -- and then says where the binding content lives, when the surrounding
# passage has any. A reviewer scanning this section is looking for a reason
# that fits none of those four shapes, or one whose "binds at X" pointer
# names nothing. That is a cheaper audit than re-reading 89 sentences, which
# is the point of constraining the shape at all.

