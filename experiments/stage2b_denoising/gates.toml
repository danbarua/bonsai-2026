# =============================================================================
# binding_claim -- obligations on what may be CLAIMED
# =============================================================================
#
# Binds WHAT MAY BE WRITTEN, not what the program does. No code path can
# enforce these and pretending one could is the failure this inventory
# exists to prevent. A person discharges them; the row records where.
#
#   locator      source document plus a STABLE locator -- a line number
#                moves, a section or anchor does not
#   obligation   the normalized obligation: what must or must not be
#                claimed or done
#   status       discharged | pending_package | not_applicable | unresolved
#   discharged_in / evidence   required only when status = discharged. The
#                evidence must point at an ARTIFACT, never at who checked
#                it: an agent attribution is not reviewer-checkable, and a
#                mesh `instance:` tag names a ROLE rather than a session.
#
# `pending_package` -- reviewed, binding, and not dischargeable because the
# readiness package it discharges into does not exist. Needs
# `pending_reason`; fails readiness. Distinct from `unresolved` on purpose:
# unresolved wants a reviewer, pending_package wants an artifact, and a
# reader who cannot tell which cannot triage the list.
#
# NEGATIVE ATTESTATION, required when the obligation is never/must-not
# shaped. Pointing at one compliant paragraph cannot establish the
# prohibited claim is absent from everywhere else, so the row states the
# OUTPUT SET it ranges over. A positive obligation is discharged by showing
# something; a negative one is violated by an absence, and absences do not
# announce themselves.
#
# No code path can enforce these, and pretending one could is the failure the
# whole requirement exists to prevent. They are discharged by a person reading
# the package before it ships.
#
# `pending_package` is used in preference to `not_applicable` throughout,
# deliberately, and the reason is the same one that governs the not_binding
# section: pending_package FAILS readiness with a reason, not_applicable
# passes silently. Several rows below could be argued not-applicable on the
# grounds that their triggering condition has not arisen -- no audit number
# exists yet, so nothing can yet have been claimed wrongly about one. That
# argument is true today and stops being true the moment the audit runs, and
# a disposition that quietly expires is worse than one that fails loudly.

