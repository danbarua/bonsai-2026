[project]
name = "bonsai-2026"
version = "0.1.0"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "diffrax>=0.7.2",
    "ipykernel>=7.3.0",
    "jax>=0.11.0",
    "jupyterlab>=4.6.2",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "optax>=0.2.8",
    "pandas>=3.0.5",
    "pandas-stubs~=3.0.5",
    "pympler>=1.1",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "scipy-stubs~=1.18.0",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.6",
    "tqdm>=4.70.0",
    "typing-extensions>=4.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bonsai"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
gpu = [
    "mighty-colab>=0.1.21",
    "google-cloud-storage>=2.19.0",
]

[tool.pytest.ini_options]
markers = [
    "slow: full-grid reproduction checks (minutes, not seconds); deselect with -m \"not slow\"",
]
