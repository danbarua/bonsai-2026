[project]
name = "bonsai-2026"
version = "0.1.0"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "diffrax>=0.7.2",
    # Hard-imported by experiments/stage2b_denoising/stage2b_cnn.py and
    # tests/test_stage2b_cnn.py, and until now declared nowhere -- it arrived
    # only as a transitive of diffrax. `uv sync --frozen` installs it today,
    # so nothing failed; a re-lock or an upstream drop was the exposure, and
    # it is invisible to every local run because the developer's environment
    # already has it.
    "equinox>=0.13.8",
    "ipykernel>=7.3.0",
    "jax>=0.11.0",
    "jupyterlab>=4.6.2",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "optax>=0.2.8",
    "pandas>=3.0.5",
    "pandas-stubs~=3.0.5",
    "pympler>=1.1",
    "pyright>=1.1.411",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "scipy-stubs~=1.18.0",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.6",
    "tqdm>=4.70.0",
    "typing-extensions>=4.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bonsai"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    # tests/test_review_workflow.py parses the GitHub workflow rather than
    # substring-matching it. Declared rather than relied on transitively:
    # PyYAML arrives today via another dependency, so the test passes locally
    # and would break on any lockfile change with an ImportError pointing
    # nowhere near the cause.
    "pyyaml>=6.0",
    # Arrived transitively via google-cloud-storage (the `gpu` group) and
    # was relied on that way, until a bare `uv sync` pruned it on its own
    # and turned test_crc32c_agrees_with_google_crc32c_where_it_is_installed
    # into a SKIP. `stage2b_gcs.py` falls back to a pure-Python CRC32C, so
    # nothing failed; the test asserting that fallback computes the same
    # digest as the library GCS actually uses simply stopped running.
    #
    # DEV, not `gpu`, and the placement is the whole fix. It is a checksum
    # wheel -- no credentials, no cost, no cloud CLI -- so every environment
    # that runs the suite should have it, INCLUDING credential-free CI,
    # which previously carried this test in its skip baseline. Putting it in
    # `gpu` would have left it absent exactly where the suite normally runs.
    "google-crc32c>=1.5.0",
]
gpu = [
    # >=0.4.1 for the `--json` envelope contract every GPU recipe now branches
    # on: the CLI's exit code answers "did the client complete its
    # transaction" and the remote job's own outcome moves into the envelope's
    # `status`, with stable `reason` codes for the session-absent and
    # teardown-already-done cases. 0.4.1 specifically, not 0.4.0: the earlier
    # release could still leak its update-check banner onto stdout alongside
    # the envelope, which corrupts the parse for every recipe here.
    #
    # This is a FLOOR WITH TEETH, not a preference. Under 0.3.0 the recipes
    # would still run and would be WRONG in the expensive direction: no
    # `--json` flag means no envelope on stdout, so the status check reads a
    # malformed value and every run fails closed -- and the older exit-code
    # semantics that the recipes no longer implement are exactly what a
    # partial upgrade would silently reinstate.
    #
    # The Makefile calls `uv run --group gpu mighty-colab`, so the floor here
    # is what the targets actually get -- a newer global install does not
    # reach them.
    "mighty-colab>=0.4.1",
    "google-cloud-storage>=2.19.0",
]

[tool.pytest.ini_options]
markers = [
    "slow: full-grid reproduction checks (minutes, not seconds); deselect with -m \"not slow\"",
]
