[project]
name = "bonsai-2026"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.1",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "scipy-stubs~=1.18.0",
    "tqdm>=4.70.0",
    "typing-extensions>=4.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bonsai"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = [
    "slow: full-grid reproduction checks (minutes, not seconds); deselect with -m \"not slow\"",
]
